spring.application.name=tienda

#Se define el puerto por donde se escucha el servidor web
server.port=80

#Se define el formato del log fecha/hora
logging.pattern.dateformat=hh:mm

#Se evita mostrar el banner SPRING en el log
spring.main.banner-mode=off

#Se evita el uso de cache en desarrollo y se evita en producción
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/techshop
spring.datasource.url=jdbc:mysql://mysql-164102ee-carlosru563-8a7b.l.aivencloud.com:12519/techshop
 
#Usuario y clave de creaTablas.sql

spring.datasource.username=usuario_prueba

spring.datasource.password=Usuar1o_Clave.
 
#Driver y plataforma de comunicación

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.type.descriptor.sql.BasicBinder=TRACE
